name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hook scripts run on the **consuming project's Node**, not this plugin repo's.
        # Consumers may still be on older runtimes, so keep the engines floor (20)
        # while also verifying the currently maintained LTS lines (22 maintenance · 24 active).
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependency install step. Both the plugin and the verification harness use
      # only Node built-ins. Run via npm test to stay coupled to package.json
      # scripts.test (the repo's canonical verification command).
      - name: Verify suite
        run: npm test

      # Manifest and frontmatter conformance. Without the claude CLI on PATH this
      # runs the built-in schema check; the script reports which layers it ran.
      - name: Validate plugin spec
        run: npm run validate-plugin

      # EXPERIMENT (temporary): does `claude plugin validate` work on a runner with
      # no credentials? If it does, the official validator becomes a real CI gate
      # instead of a local-only one. Non-blocking until measured.
      - name: Probe official validator availability
        if: matrix.node == '22'
        continue-on-error: true
        run: |
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 || { echo "install failed"; exit 1; }
          claude --version
          claude plugin validate ./.claude-plugin/marketplace.json --strict
          echo "PROBE_RESULT: official validator ran unauthenticated"
