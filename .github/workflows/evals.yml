# Behavioral evals — on demand, never per PR.
#
# The cases under evals/ drive real Claude sessions, so a run costs tokens and
# needs an API key. CI keeps the free gates (npm test, validate-plugin) on every
# PR and reserves this workflow for a manual trigger; results are uploaded as a
# workflow artifact. The `release: published` trigger stays declared, but a
# Release that release-tag.yml creates with GITHUB_TOKEN does not start it.
name: Evals

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Case glob (empty = all)'
        required: false
        default: ''
      runs:
        description: 'Runs per case (1 fits the $45 ceiling; run a three-run release suite locally with a higher --max-cost-usd)'
        required: false
        default: '1'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # At one run per case, the single-arm cases (about $1.5 a run) plus the
          # `ablation`-tagged cases, which run with and without the plugin and report a Δ
          # instead of a pass, fit a $45 ceiling that the runner checks before each case
          # starts; three runs need more, and the cases that do not fit stay unstarted.
          ARGS=(--threshold 0.8 --runs "${{ github.event.inputs.runs || '1' }}" --max-cost-usd 45 --json evals/results/latest.json)
          if [ -n "${{ github.event.inputs.case }}" ]; then ARGS+=(--case "${{ github.event.inputs.case }}"); fi
          npm run eval -- "${ARGS[@]}"
          # A native run always exposes Agent, so fallback-only cases run through the claude -p runner.
          if [ -z "${{ github.event.inputs.case }}" ]; then npm run eval -- --fallback --tag fallback-only --threshold 0.8 --runs "${{ github.event.inputs.runs || '1' }}" --max-cost-usd 5; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
