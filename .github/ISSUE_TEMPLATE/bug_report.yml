name: Bug report
description: A command, agent, hook, or script behaves differently than documented
labels: ['fix']
assignees: ['S-jooyoung']
body:
  - type: markdown
    attributes:
      value: |
        This plugin's behavior is declared in Markdown, so "what the docs say" and "what happened" are both evidence. Please give me the pair.

        **Security problems do not belong here** — use [private reporting](https://github.com/S-jooyoung/oh-my-joy/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `/plugin list`, or the `version` in `.claude-plugin/plugin.json`. Run `/plugin update oh-my-joy@omj` and `/reload-plugins` first — stale installs are the most common cause.
      placeholder: '0.7.0'
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - /oh-my-joy:spec
        - /oh-my-joy:verify
        - /oh-my-joy:fix
        - /oh-my-joy:sync
        - /oh-my-joy:setup
        - /oh-my-joy:review
        - /oh-my-joy:ship
        - /oh-my-joy:deep-interview
        - The oh-my-joy output style
        - An agent (figma-implementer / design-qa)
        - A hook (check-design-tokens / check-story-exists)
        - scripts/ (release, validate-plugin, eval-runner)
        - evals/ (eval cases)
        - Docs / README
        - Something else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where that is documented
      description: Quote the line from the README, `commands/*.md`, or `docs/` that led you to expect it. If nothing documents it, say so — that may itself be the bug.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the actual output. For a permission prompt you did not expect, include the exact tool name shown.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/oh-my-joy:spec <figma-url>`
        2. Approve the plan
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Claude Code version (`claude --version`), OS, and Node version if a script is involved.
    validations:
      required: false
