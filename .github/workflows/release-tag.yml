# On a main merge, auto-attach the plugin.json version's tag and GitHub Release.
#
# The decision is a **state comparison** (create the tag if the plugin.json version has
# none), not commit-title parsing — release commit titles were historically inconsistent
# (v0.5.0 lacked "(#N)"; v0.1–0.3 were tagged on feat commits), and a state comparison is
# idempotent regardless of title edits or manual pushes. The tag always attaches to the
# just-pushed main commit ($GITHUB_SHA), so the v0.4.0 failure mode (tagging an orphan
# commit) cannot recur.
#
# No infinite triggering (twofold): ① tag pushes and release events created with
# GITHUB_TOKEN do not trigger other workflows (GitHub recursion guard). ② no workflow
# listens to tags/release, and ci.yml's branches filter does not match tag pushes.
#
# contents:write lives in this file only — ci.yml keeps read-only least privilege.
name: Release tag

on:
  push:
    branches: [main]
  workflow_dispatch: # for re-running partial failures and manual dry-runs — the logic is idempotent, safe to press anytime

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false # never cancel mid-tagging — consecutive merges are handled by queueing

jobs:
  tag:
    # Running workflow_dispatch on a feature-branch ref makes $GITHUB_SHA a non-main commit —
    # exactly the path of the v0.4.0 orphan-tag incident, so outside the main ref the job does not run at all.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for tag-existence and ancestry checks

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Self-gate before tagging — the 4-surface version match, CHANGELOG links, and skeleton checks run here.
      - name: Verify suite
        run: npm test

      - name: Determine and create version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')).version")
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-list -n1 "$TAG")
            if git merge-base --is-ancestor "$EXISTING" "$GITHUB_SHA"; then
              echo "::notice::$TAG already exists (reachable from main) — no-op"
            else
              # Detect-and-continue would publish a Release on an orphan tag — fail the job here to block that.
              echo "::error::$TAG points at a commit outside main ($EXISTING) — retag it to a main commit and re-run"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "::notice::Attached $TAG to $GITHUB_SHA"
          fi

          # A partial failure (tag exists but no Release) also heals on re-run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node scripts/release.mjs notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
            echo "::notice::Published GitHub Release $TAG"
          fi
