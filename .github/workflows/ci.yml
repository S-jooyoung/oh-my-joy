name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 훅 스크립트는 플러그인 레포가 아니라 **소비 프로젝트의 Node**에서 돌아간다.
        # 소비자가 아직 옛 런타임에 남아 있을 수 있으므로 engines 하한(20)을 버리지 않고,
        # 현재 유지되는 LTS 라인(22 maintenance · 24 active)을 함께 검증한다.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 의존성 설치 단계가 없다. 플러그인도 검증 하네스도 Node 내장 모듈만 쓴다.
      - name: 검증 스위트
        run: node --test
